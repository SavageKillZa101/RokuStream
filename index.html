<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub Enterprise Media Engine</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --surface-color: #181a20;
            --surface-hover: #222630;
            --primary-color: #e50914;
            --primary-hover: #f6121d;
            --text-main: #ffffff;
            --text-muted: #9aa0a6;
            --border-color: #2d313e;
            --radius-sm: 6px;
            --radius-lg: 12px;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Header Layout */
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(15, 16, 21, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .logo-group { display: flex; align-items: center; gap: 12px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary-color); letter-spacing: -0.5px; text-decoration: none; }
        
        .controls { display: flex; gap: 12px; align-items: center; }
        .input-field { background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 16px; border-radius: var(--radius-sm); outline: none; font-size: 0.9rem; transition: border-color var(--transition-fast); }
        .input-field:focus { border-color: var(--primary-color); }
        .btn { background: var(--surface-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all var(--transition-fast); display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { background: var(--surface-hover); border-color: #404656; }
        .btn-primary { background: var(--primary-color); border-color: var(--primary-color); }
        .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

        /* Main Section */
        main { padding: 32px; flex: 1; max-width: 1600px; margin: 0 auto; width: 100%; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .section-title { font-size: 1.25rem; font-weight: 700; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
        .card { background-color: var(--surface-color); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; border: 1px solid var(--border-color); transition: transform var(--transition-fast), border-color var(--transition-fast); position: relative; }
        .card:hover { transform: translateY(-4px); border-color: var(--primary-color); }
        .card img { width: 100%; height: 270px; object-fit: cover; display: block; background-color: #000; }
        .card-info { padding: 12px; }
        .card-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }

        /* User Profile & Keys Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 100%; max-width: 500px; padding: 24px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .modal-box h3 { margin-bottom: 16px; font-size: 1.2rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input { width: 100%; }

        /* Video Player Modal */
        .player-modal-box { max-width: 1200px; width: 95%; display: flex; flex-direction: column; gap: 16px; }
        .player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-color); }
        .player-container iframe { width: 100%; height: 100%; border: none; }
        .player-controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .selector-group { display: flex; gap: 8px; align-items: center; }
        select.input-field { cursor: pointer; padding: 8px 12px; }

        /* Skeletons */
        .skeleton { background: linear-gradient(90deg, var(--surface-color) 25%, var(--surface-hover) 50%, var(--surface-color) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-group">
            <a href="#" class="logo">STREAMHUB</a>
        </div>
        <div class="controls">
            <input type="text" id="search-input" class="input-field" placeholder="Search movies, TV shows..." aria-label="Search">
            <button class="btn" id="account-btn" onclick="UI.toggleAccountModal()">
                <span id="account-status-label">Account / Settings</span>
            </button>
        </div>
    </header>

    <main>
        <div class="section-header">
            <h2 class="section-title" id="grid-title">Trending Content</h2>
        </div>
        <div class="grid" id="media-grid"></div>
    </main>

    <!-- Settings / Account Modal -->
    <div class="modal-overlay" id="account-modal">
        <div class="modal-box">
            <h3>Account & Service Configuration</h3>
            <div class="form-group">
                <label for="user-name-input">User Profile Name</label>
                <input type="text" id="user-name-input" class="input-field" placeholder="Enter profile name">
            </div>
            <div class="form-group">
                <label for="tmdb-key-input">TMDB API Key (Optional Override)</label>
                <input type="text" id="tmdb-key-input" class="input-field" placeholder="Custom TMDB API Key">
            </div>
            <div class="form-group">
                <label for="febbox-token-input">FebBox Direct Bearer Token</label>
                <input type="text" id="febbox-token-input" class="input-field" placeholder="Paste custom FebBox token">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
                <button class="btn" onclick="UI.toggleAccountModal()">Cancel</button>
                <button class="btn btn-primary" onclick="AuthManager.saveSettings()">Save Configuration</button>
            </div>
        </div>
    </div>

    <!-- Media Player Modal -->
    <div class="modal-overlay" id="player-modal">
        <div class="modal-box player-modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="player-media-title" style="margin: 0;">Media Title</h3>
                <button class="btn" onclick="Player.close()">&times; Close</button>
            </div>
            <div class="player-container">
                <iframe id="video-frame" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="player-controls-bar">
                <div class="selector-group">
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Engine:</span>
                    <button class="btn btn-primary" id="btn-vidking" onclick="Player.switchSource('vidking')">VidKing</button>
                    <button class="btn" id="btn-febbox" onclick="Player.switchSource('febbox')">FebBox</button>
                </div>
                <div class="selector-group" id="tv-controls" style="display: none;">
                    <select id="season-select" class="input-field" onchange="Player.onSeasonChange()"></select>
                    <select id="episode-select" class="input-field" onchange="Player.onEpisodeChange()"></select>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Core Configuration & State Store
         */
        const CONFIG = {
            DEFAULT_TMDB_KEY: "41cd097c8beb5d6582f7ab6f11180b6d",
            STORAGE_KEY: "streamhub_app_state_v1"
        };

        const state = {
            user: { name: "Guest", tmdbKey: "", febboxToken: "" },
            currentMedia: { id: null, type: null, title: '', season: 1, episode: 1 },
            activeSource: 'vidking',
            searchDebounceTimer: null
        };

        /**
         * Account & Configuration Manager
         */
        const AuthManager = {
            init() {
                const stored = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        state.user = { ...state.user, ...parsed };
                    } catch (e) {
                        console.error("State hydration failure", e);
                    }
                }
                this.syncUI();
            },
            saveSettings() {
                state.user.name = document.getElementById('user-name-input').value.trim() || "Guest";
                state.user.tmdbKey = document.getElementById('tmdb-key-input').value.trim();
                state.user.febboxToken = document.getElementById('febbox-token-input').value.trim();

                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state.user));
                this.syncUI();
                UI.toggleAccountModal();
                MediaEngine.fetchTrending();
            },
            syncUI() {
                document.getElementById('user-name-input').value = state.user.name;
                document.getElementById('tmdb-key-input').value = state.user.tmdbKey;
                document.getElementById('febbox-token-input').value = state.user.febboxToken;
                document.getElementById('account-status-label').innerText = `Profile: ${state.user.name}`;
            },
            getTmdbKey() {
                return state.user.tmdbKey || CONFIG.DEFAULT_TMDB_KEY;
            }
        };

        /**
         * Media Fetcher Engine
         */
        const MediaEngine = {
            async fetchTrending() {
                UI.setGridTitle("Trending Content");
                UI.showSkeletons();
                const url = `https://api.themoviedb.org/3/trending/all/week?api_key=${AuthManager.getTmdbKey()}`;
                await this.executeQuery(url);
            },
            async search(query) {
                UI.setGridTitle(`Search Results for "${query}"`);
                UI.showSkeletons();
                const url = `https://api.themoviedb.org/3/search/multi?api_key=${AuthManager.getTmdbKey()}&query=${encodeURIComponent(query)}`;
                await this.executeQuery(url);
            },
            async executeQuery(url) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP Error Status: ${res.status}`);
                    const data = await res.json();
                    UI.renderGrid(data.results || []);
                } catch (err) {
                    console.error("Fetch Exception:", err);
                    UI.renderError("Unable to load streams. Check your API configuration.");
                }
            }
        };

        /**
         * UI Rendering Controller
         */
        const UI = {
            grid: document.getElementById('media-grid'),
            gridTitle: document.getElementById('grid-title'),

            setGridTitle(title) { this.gridTitle.innerText = title; },

            showSkeletons() {
                this.grid.innerHTML = Array(12).fill(0).map(() => `
                    <div class="card">
                        <div class="skeleton" style="height:270px;"></div>
                        <div class="card-info">
                            <div class="skeleton" style="height:16px; margin-bottom:8px;"></div>
                            <div class="skeleton" style="height:12px; width:40%;"></div>
                        </div>
                    </div>
                `).join('');
            },

            renderGrid(items) {
                this.grid.innerHTML = '';
                const validItems = items.filter(item => item.poster_path && (item.media_type === 'movie' || item.media_type === 'tv' || item.title || item.name));
                
                if (validItems.length === 0) {
                    this.renderError("No media found matching criteria.");
                    return;
                }

                validItems.forEach(item => {
                    const isMovie = item.media_type === 'movie' || Boolean(item.title);
                    const title = isMovie ? item.title : item.name;
                    const mediaType = isMovie ? 'movie' : 'tv';
                    const releaseYear = (item.release_date || item.first_air_date || '').split('-')[0] || 'N/A';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${title}" loading="lazy">
                        <div class="card-info">
                            <div class="card-title">${title}</div>
                            <div class="card-meta">
                                <span style="text-transform:uppercase;">${mediaType}</span>
                                <span>${releaseYear}</span>
                            </div>
                        </div>
                    `;
                    card.onclick = () => Player.launch(item.id, mediaType, title);
                    this.grid.appendChild(card);
                });
            },

            renderError(msg) {
                this.grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">${msg}</div>`;
            },

            toggleAccountModal() {
                document.getElementById('account-modal').classList.toggle('active');
            }
        };

        /**
         * Media Player Operations
         */
        const Player = {
            modal: document.getElementById('player-modal'),
            iframe: document.getElementById('video-frame'),
            tvControls: document.getElementById('tv-controls'),

            async launch(id, type, title) {
                state.currentMedia = { id, type, title, season: 1, episode: 1 };
                document.getElementById('player-media-title').innerText = title;

                if (type === 'tv') {
                    this.tvControls.style.display = 'flex';
                    await this.loadSeasons(id);
                } else {
                    this.tvControls.style.display = 'none';
                }

                this.switchSource('vidking');
                this.modal.classList.add('active');
            },

            async loadSeasons(tmdbId) {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}?api_key=${AuthManager.getTmdbKey()}`);
                    const data = await res.json();
                    const seasonSelect = document.getElementById('season-select');
                    seasonSelect.innerHTML = '';

                    data.seasons.filter(s => s.season_number > 0).forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.innerText = `Season ${s.season_number}`;
                        seasonSelect.appendChild(opt);
                    });

                    await this.onSeasonChange();
                } catch (e) {
                    console.error("Season parsing failure", e);
                }
            },

            async onSeasonChange() {
                const seasonNum = document.getElementById('season-select').value || 1;
                state.currentMedia.season = seasonNum;

                try {
                    const res = await fetch(`https://api.themoviedb.org/3/tv/${state.currentMedia.id}/season/${seasonNum}?api_key=${AuthManager.getTmdbKey()}`);
                    const data = await res.json();
                    const epSelect = document.getElementById('episode-select');
                    epSelect.innerHTML = '';

                    data.episodes.forEach(ep => {
                        const opt = document.createElement('option');
                        opt.value = ep.episode_number;
                        opt.innerText = `Ep ${ep.episode_number}: ${ep.name}`;
                        epSelect.appendChild(opt);
                    });

                    state.currentMedia.episode = 1;
                    this.reload();
                } catch (e) {
                    console.error("Episode parsing failure", e);
                }
            },

            onEpisodeChange() {
                state.currentMedia.episode = document.getElementById('episode-select').value;
                this.reload();
            },

            switchSource(provider) {
                state.activeSource = provider;
                document.getElementById('btn-vidking').classList.toggle('btn-primary', provider === 'vidking');
                document.getElementById('btn-febbox').classList.toggle('btn-primary', provider === 'febbox');
                this.reload();
            },

            reload() {
                const { id, type, season, episode } = state.currentMedia;
                let embedUrl = '';

                if (state.activeSource === 'vidking') {
                    const params = `color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`;
                    embedUrl = type === 'movie'
                        ? `https://www.vidking.net/embed/movie/${id}?${params}`
                        : `https://www.vidking.net/embed/tv/${id}/${season}/${episode}?${params}`;
                } else if (state.activeSource === 'febbox') {
                    const token = state.user.febboxToken;
                    embedUrl = `https://www.febbox.com/share/${id}` + (token ? `?token=${encodeURIComponent(token)}` : '');
                }

                this.iframe.src = embedUrl;
            },

            close() {
                this.iframe.src = '';
                this.modal.classList.remove('active');
            }
        };

        /**
         * Global Event Listeners & Initialization
         */
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(state.searchDebounceTimer);
            const query = e.target.value.trim();
            if (query.length > 2) {
                state.searchDebounceTimer = setTimeout(() => MediaEngine.search(query), 400);
            } else if (query.length === 0) {
                MediaEngine.fetchTrending();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                Player.close();
                document.getElementById('account-modal').classList.remove('active');
            }
        });

        // Application Bootstrap
        window.addEventListener('DOMContentLoaded', () => {
            AuthManager.init();
            MediaEngine.fetchTrending();
        });
    </script>
</body>
</html>
