<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub Ultimate Media Player</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-dim: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="text"] {
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #444;
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 4px;
            outline: none;
            width: 280px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        /* Main Content */
        main {
            padding: 20px 40px;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Poster Cards */
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 10px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-type {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Player Overlay Modal */
        #player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-header {
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .modal-title {
            font-size: 1.2rem;
            color: var(--text-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .player-container {
            width: 90%;
            max-width: 1200px;
            height: 70vh;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .server-controls {
            width: 90%;
            max-width: 1200px;
            display: flex;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .server-btn {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .server-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .ep-controls {
            display: flex;
            gap: 10px;
            margin-left: auto;
            align-items: center;
        }

        .ep-controls select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">StreamHub</div>
        <div class="controls">
            <input type="text" id="search-input" placeholder="Search movies or TV shows...">
        </div>
    </header>

    <main>
        <h2 class="section-title" id="grid-title">Trending Content</h2>
        <div class="grid" id="media-grid"></div>
    </main>

    <!-- Video Player Overlay -->
    <div id="player-modal">
        <div class="modal-header">
            <div class="modal-title" id="player-media-title">Playing Media</div>
            <button class="close-btn" onclick="closePlayer()">&times;</button>
        </div>
        <div class="player-container">
            <iframe id="video-frame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="server-controls">
            <span style="font-size: 0.85rem; color: var(--text-dim);">Source:</span>
            <button class="server-btn active" id="btn-vidking" onclick="switchSource('vidking')">VidKing Engine</button>
            <button class="server-btn" id="btn-febbox" onclick="switchSource('febbox')">FebBox Direct</button>

            <div class="ep-controls" id="tv-controls" style="display: none;">
                <label style="font-size: 0.85rem;">Season:</label>
                <select id="season-select" onchange="updateEpisodeSelector()"></select>
                <label style="font-size: 0.85rem;">Episode:</label>
                <select id="episode-select" onchange="reloadPlayer()"></select>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = "41cd097c8beb5d6582f7ab6f11180b6d";
        const FEBBOX_TOKEN = "..";

        let currentMedia = { id: null, type: null, title: '', season: 1, episode: 1 };
        let activeSource = 'vidking';

        const mediaGrid = document.getElementById('media-grid');
        const gridTitle = document.getElementById('grid-title');
        const searchInput = document.getElementById('search-input');
        const playerModal = document.getElementById('player-modal');
        const tvControls = document.getElementById('tv-controls');

        window.addEventListener('DOMContentLoaded', fetchTrending);

        // Live Search with 400ms Debounce
        let searchTimeout = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (query.length > 2) {
                searchTimeout = setTimeout(() => executeSearch(query), 400);
            } else if (query.length === 0) {
                fetchTrending();
            }
        });

        async function fetchTrending() {
            gridTitle.innerText = "Trending Content";
            const url = `https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}`;
            await loadMediaData(url);
        }

        async function executeSearch(query) {
            gridTitle.innerText = `Search Results for "${query}"`;
            const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`;
            await loadMediaData(url);
        }

        async function loadMediaData(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.results) {
                    renderGrid(data.results);
                }
            } catch (err) {
                console.error("Failed to load content:", err);
            }
        }

        function renderGrid(items) {
            mediaGrid.innerHTML = '';
            items.forEach(item => {
                if (!item.poster_path) return;

                const isMovie = item.media_type === 'movie' || item.title;
                const title = isMovie ? item.title : item.name;
                const mediaType = isMovie ? 'movie' : 'tv';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${title}">
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-type">${mediaType}</div>
                    </div>
                `;
                card.onclick = () => launchPlayer(item.id, mediaType, title);
                mediaGrid.appendChild(card);
            });
        }

        async function launchPlayer(id, type, title) {
            currentMedia = { id, type, title, season: 1, episode: 1 };
            document.getElementById('player-media-title').innerText = title;

            if (type === 'tv') {
                tvControls.style.display = 'flex';
                await setupTvSelectors(id);
            } else {
                tvControls.style.display = 'none';
            }

            switchSource('vidking');
            playerModal.style.display = 'flex';
        }

        async function setupTvSelectors(tmdbId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${tmdbId}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                const seasonSelect = document.getElementById('season-select');
                seasonSelect.innerHTML = '';

                data.seasons.forEach(s => {
                    if (s.season_number > 0) {
                        const opt = document.createElement('option');
                        opt.value = s.season_number;
                        opt.innerText = `Season ${s.season_number}`;
                        seasonSelect.appendChild(opt);
                    }
                });

                updateEpisodeSelector();
            } catch (err) {
                console.error("Failed to fetch season details:", err);
            }
        }

        async function updateEpisodeSelector() {
            const seasonNum = document.getElementById('season-select').value || 1;
            currentMedia.season = seasonNum;
            
            try {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${currentMedia.id}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                const epSelect = document.getElementById('episode-select');
                epSelect.innerHTML = '';

                data.episodes.forEach(ep => {
                    const opt = document.createElement('option');
                    opt.value = ep.episode_number;
                    opt.innerText = `Ep ${ep.episode_number}: ${ep.name}`;
                    epSelect.appendChild(opt);
                });

                currentMedia.episode = 1;
                reloadPlayer();
            } catch (err) {
                console.error("Failed to fetch episode details:", err);
            }
        }

        function reloadPlayer() {
            if (currentMedia.type === 'tv') {
                currentMedia.season = document.getElementById('season-select').value;
                currentMedia.episode = document.getElementById('episode-select').value;
            }
            switchSource(activeSource);
        }

        function switchSource(provider) {
            activeSource = provider;
            const iframe = document.getElementById('video-frame');
            const { id, type, season, episode } = currentMedia;

            document.getElementById('btn-vidking').classList.toggle('active', provider === 'vidking');
            document.getElementById('btn-febbox').classList.toggle('active', provider === 'febbox');

            let embedUrl = '';

            if (provider === 'vidking') {
                // VidKing Integration with URL options matching requirements
                const params = `color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`;
                embedUrl = type === 'movie'
                    ? `https://www.vidking.net/embed/movie/${id}?${params}`
                    : `https://www.vidking.net/embed/tv/${id}/${season}/${episode}?${params}`;
            } else if (provider === 'febbox') {
                // FebBox stream resolution endpoint passing bearer token
                embedUrl = `https://www.febbox.com/share/${id}?token=${FEBBOX_TOKEN}`;
            }

            iframe.src = embedUrl;
        }

        function closePlayer() {
            document.getElementById('video-frame').src = '';
            playerModal.style.display = 'none';
        }
    </script>
</body>
</html>
